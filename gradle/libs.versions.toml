[versions]
agp = "9.0.0"
kotlin = "2.2.10"
# Exact: this integration builds on Galva's integration API, so it pins the release it was tested with.
galva = "1.3.0"
# Any 10.x: 10.0.0 is the first on Play Billing 8, which Galva requires, and 11 is an untested major.
# An app's own 10.x is shared as is; an older one is raised to the latest 10.x; 11+ fails the build
# unless the app declares it strictly. A range, not 10.+, which would raise every app to the latest 10.x.
revenuecat = { strictly = "[10.0.0, 11.0.0)" }
kotlinxCoroutines = "1.11.0"
lifecycle = "2.9.4"
androidxActivity = "1.8.0"
junit = "4.13.2"
robolectric = "4.16.1"
mockito = "6.3.0"
vanniktech = "0.36.0"

[libraries]
galva-sdk = { group = "io.galva.sdk", name = "galva-sdk", version.ref = "galva" }
revenuecat = { group = "com.revenuecat.purchases", name = "purchases", version.ref = "revenuecat" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidxActivity" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
mockito-kotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockito" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech" }
